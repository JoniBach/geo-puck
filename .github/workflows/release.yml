# Everything that leaves this repository does so here, when a change is merged to main. Nothing is
# released or deployed by hand.
#
#   1. The checks CI ran on the pull request run again on the merged code.
#   2. If the packages' version has no release yet, one is made: tag v<version>, with the packages
#      attached as .tgz files (an app can install straight from those URLs).
#   3. Each package whose version is not on npm is published there, by trusted publishing: no token
#      is stored. This step waits for the repository variable NPM_PUBLISH to be "true", because npm
#      needs each package published once by hand before a trusted publisher can be set for it.
#   4. The demo is built and deployed to GitHub Pages.
#
# So to release: raise "version" in packages/data, packages/tree and packages/puck's package.json
# (and the puck's dependency on the data package) in a pull request, and merge it. A merge that leaves
# the version alone re-deploys the demo and releases nothing.
name: Release
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  packages:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack
      - run: npm test
      - name: The version, and whether it is already released
        id: version
        run: |
          data="$(node -p "require('./packages/data/package.json').version")"
          tree="$(node -p "require('./packages/tree/package.json').version")"
          puck="$(node -p "require('./packages/puck/package.json').version")"
          if [ "$data" != "$puck" ] || [ "$tree" != "$puck" ]; then echo "the packages must share a version (data $data, tree $tree, puck $puck)"; exit 1; fi
          echo "version=$puck" >> "$GITHUB_OUTPUT"
          if gh release view "v$puck" >/dev/null 2>&1; then echo "released=true" >> "$GITHUB_OUTPUT"; else echo "released=false" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Release on GitHub, with the packages attached
        if: steps.version.outputs.released == 'false'
        run: gh release create "v${{ steps.version.outputs.version }}" dist-packs/*.tgz --target "$GITHUB_SHA" --title "${{ steps.version.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish to npm what is not there yet
        if: vars.NPM_PUBLISH == 'true'
        run: |
          for dir in packages/data packages/tree packages/puck; do
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm"
            else
              npm publish -w "$dir"
            fi
          done

  demo:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:demo
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/build
      - id: deploy
        uses: actions/deploy-pages@v4
